<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Калькулятор | Лабораторная 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="calc-wrapper">
    <div class="inputs">
        <input type="number" id="num1" placeholder="0">
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" id="num2" placeholder="0">
    </div>
 
    <p id="error-msg"></p>
 
    <button onclick="calculate()">Подсчитать</button>
 
    <div id="results"></div>
</div>
 
<script src="script.js"></script>
</body>
</html>
